<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion du Dépôt - Mercerie Générale Nina Fashion</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #111418;
            --gold: #b38728;
            --bg-light: #f8f9fa;
            --border: #e5e7eb;
            --text-dark: #333;
            --danger: #c0392b;
            --success: #27ae60;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-light); color: var(--primary); min-height: 100vh; }
        header { background: white; border-bottom: 1px solid var(--border); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-family: 'Georgia', serif; font-size: 1.2rem; margin: 0; letter-spacing: 1px; }
        .btn-retour { background: transparent; border: none; font-size: 0.75rem; color: #888; cursor: pointer; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; }
        #badge-magasinier { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 2px; color: var(--gold); font-weight: bold; }
        .tabs-container { background: white; border-bottom: 1px solid var(--border); padding: 0 20px; }
        .tabs { display: flex; gap: 25px; overflow-x: auto; scrollbar-width: none; }
        .tabs::-webkit-scrollbar { display: none; }
        .tab-btn { background: transparent; border: none; padding: 15px 0; font-size: 0.8rem; color: #888; text-transform: uppercase; font-weight: bold; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; transition: 0.3s; }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--gold); }
        .container { padding: 20px; display: none; max-width: 800px; margin: 0 auto; width: 100%; animation: fadeIn 0.3s ease-in-out; }
        .container.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .form-card { background: white; border-radius: 4px; padding: 25px; margin-bottom: 20px; border: 1px solid var(--border); box-shadow: 0 5px 15px rgba(0,0,0,0.02); }
        .form-card h2, .form-card h3 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: var(--primary); margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 0.75rem; font-weight: bold; color: #888; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 4px; font-size: 0.9rem; background: #fafafa; outline: none; }
        input:focus, select:focus { border-color: var(--gold); background: white; }
        .btn-block { width: 100%; padding: 14px; border: none; border-radius: 4px; font-weight: bold; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: 0.3s; }
        .btn-gold { background: var(--primary); color: white; }
        .btn-gold:active { background: #000; }
        .btn-success { background: var(--gold); color: white; margin-top: 10px; }
        .btn-danger { background: var(--danger); color: white; width: auto; padding: 8px 15px; font-size: 0.7rem; border-radius: 4px; }
        .btn-block:disabled { background: #e0e0e0; cursor: not-allowed; color: #888; }
        .table-responsive { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; border-bottom: 1px solid var(--border); color: #888; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; }
        td { padding: 12px; border-bottom: 1px solid var(--bg-light); font-size: 0.85rem; color: var(--primary); }
        .alerte-card { background: white; border: 1px solid var(--border); border-left: 3px solid var(--danger); padding: 15px; margin-bottom: 10px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        .cache { display: none !important; }
        .titre-famille { color: var(--primary); padding: 15px 0 5px 0; border-bottom: 2px solid var(--primary); margin-top: 25px; font-family: 'Georgia', serif; font-weight: bold; font-size: 0.9rem; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; display: flex; justify-content: space-between; }
        .titre-article { background: white; color: var(--primary); padding: 14px; margin-top: 8px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; border-radius: 4px; border: 1px solid var(--border); font-size: 0.85rem; }
        .contenu-couleurs { background: white; border: 1px solid var(--border); border-top: none; padding: 10px; border-radius: 0 0 4px 4px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <header>
        <button class="btn-retour" onclick="deconnexionPropre(); window.location.replace('index.html')">◄ Quitter</button>
        <h1>Nina Fashion</h1>
        <div id="badge-magasinier">Logistique</div>
    </header>

    <div class="tabs-container">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('vision')">Vision Globale</button>
            <button class="tab-btn" onclick="switchTab('mouvement')">Mouvements</button>
            <button class="tab-btn" onclick="switchTab('commande')">Alertes & Commandes</button>
        </div>
    </div>
    
    <!-- ONGLET 1 : VISION GLOBALE -->
    <div id="tab-vision" class="container active">
        <input type="text" id="search-stock" placeholder="🔍 Rechercher un article ou une couleur..." onkeyup="filtrerStock()">
        <div class="table-responsive">
            <table>
                <thead>
                    <tr><th>Article</th><th>Couleur</th><th>Quantité</th><th>Seuil</th></tr>
                </thead>
                <tbody id="table-stock-body">
                    <tr><td colspan="4" style="text-align:center; padding:30px; color:#7f8c8d; font-weight:bold;">⏳ Chargement du stock physique...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- ONGLET 2 : MOUVEMENTS -->
    <div id="tab-mouvement" class="container">
        <div class="form-card">
            <h2 style="color: var(--gold); margin-top: 0; margin-bottom: 15px; font-size: 1.1rem;">Enregistrer un mouvement</h2>
            <div class="form-group">
                <label>1. Type de mouvement :</label>
                <select id="mvt-type" onchange="toggleDestination()" style="background-color: #f8f9fa; font-weight: bold;">
                    <option value="ENTREE">📥 ENTRÉE (Arrivage Fournisseur)</option>
                    <option value="SORTIE">📤 SORTIE (Diminution du stock)</option>
                </select>
            </div>
            <div class="form-group" id="group-destination" style="display: none; background: #fffcf5; padding: 10px; border-radius: 6px; border: 1px solid var(--gold);">
                <label style="color: var(--danger);">2. Destination de la marchandise :</label>
                <select id="mvt-destination">
                    <option value="Rayon Boutique">🛍️ Transfert vers Rayons Boutique</option>
                    <option value="Atelier Interne">✂️ Consommation par les Machinistes</option>
                </select>
            </div>
            <div class="form-group">
                <label>Article du Catalogue :</label>
                <div style="position: relative;">
                    <input type="text" id="search-mvt-article" placeholder="🔍 Taper ou cliquer ici pour choisir..." onkeyup="filtrerCustomList()" onclick="afficherCustomList()" autocomplete="off" style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 4px; background-color: white;">
                    <div id="custom-list" style="display: none; position: absolute; top: 100%; left: 0; width: 100%; background: white; border: 1px solid var(--border); border-top: none; max-height: 250px; overflow-y: auto; z-index: 1000; border-radius: 0 0 4px 4px; box-shadow: 0px 5px 15px rgba(0,0,0,0.15);"></div>
                </div>
                <select id="mvt-article" style="display: none;">
                    <option value="">-- Sélectionner un article --</option>
                </select>
            </div>
            <div class="form-group">
                <label>Couleur / Motif :</label>
                <input type="text" id="mvt-couleur" placeholder="Ex: Blanc, Bleu Nuit, Doré...">
            </div>
            <div class="form-group">
                <label>Quantité :</label>
                <input type="number" id="mvt-qte" placeholder="Ex: 10" min="0">
            </div>
            <button class="btn-block btn-gold" onclick="ajouterAuBordereau()">➕ AJOUTER AU BORDEREAU</button>
        </div>

        <div class="form-card">
            <h3>📋 Bordereau en cours</h3>
            <div class="table-responsive" style="margin-bottom: 15px;">
                <table>
                    <thead><tr><th>Mvt</th><th>Détail</th><th>Qté</th><th>Action</th></tr></thead>
                    <tbody id="table-bordereau">
                        <tr><td colspan="4" style="text-align: center; color: #95a5a6; font-size: 0.9rem;">Le bordereau est vide.</td></tr>
                    </tbody>
                </table>
            </div>
            <button id="btn-valider" class="btn-block btn-success" onclick="validerBordereau()" disabled>💾 ENREGISTRER DANS LA BASE</button>
        </div>

        <div class="form-card">
            <h3>🚚 Transferts en attente de réception</h3>
            <div id="liste-transferts-attente" style="font-size: 0.9rem; color: #7f8c8d;">Chargement...</div>
        </div>
    </div>

    <!-- ONGLET 3 : ALERTES ET COMMANDES -->
    <div id="tab-commande" class="container">
        <div class="form-card">
            <h2 style="color: var(--danger); margin-top: 0; font-size: 1.1rem;">🚨 Articles en Rupture ou Alerte</h2>
            <div id="liste-alertes" style="margin-top: 15px; margin-bottom: 20px;"></div>
            <button id="btn-whatsapp" class="btn-block btn-success" onclick="envoyerWhatsApp()" style="display: none; background-color: #25D366; gap: 10px;">
                💬 TRANSMETTRE LA LISTE VIA WHATSAPP
            </button>
        </div>
    </div>
    
    <script>
        function deconnexionPropre() {
            localStorage.removeItem('sessionActive');
            localStorage.removeItem('roleUtilisateur');
            localStorage.removeItem('nomEmploye');
        }

        // --- SÉCURITÉ INSTITUTIONNELLE ---
        (function verifierSecurite() {
            const sessionActive = localStorage.getItem('sessionActive');
            const role = localStorage.getItem('roleUtilisateur') || ''; 
            const roleMinuscule = role.toLowerCase();

            if (!sessionActive || (roleMinuscule !== 'magasinier' && roleMinuscule !== 'administrateur')) {
                deconnexionPropre(); 
                window.location.replace('index.html');
                return; 
            }

            let tempsInactivite;
            const TEMPS_LIMITE = 30 * 60 * 1000; 

            function deconnexionAutomatique() {
                deconnexionPropre();
                window.location.replace('index.html');
            }

            function reinitialiserMinuteur() {
                clearTimeout(tempsInactivite);
                tempsInactivite = setTimeout(deconnexionAutomatique, TEMPS_LIMITE);
            }

            reinitialiserMinuteur();
            document.onmousemove = reinitialiserMinuteur;
            document.onkeypress = reinitialiserMinuteur;
            document.ontouchstart = reinitialiserMinuteur; 

            window.addEventListener('pageshow', function(event) {
                if (event.persisted || !localStorage.getItem('sessionActive')) {
                    deconnexionPropre();
                    window.location.replace('index.html');
                }
            });
        })();

        document.getElementById('badge-magasinier').innerText = "📦 " + (localStorage.getItem('nomEmploye') || localStorage.getItem('roleUtilisateur') || 'Logistique');
        
        // --- 1. CONFIGURATION SUPABASE ---
        const SUPABASE_URL = "https://tkqosylavymaracevaxt.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRrcW9zeWxhdnltYXJhY2V2YXh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzOTUyMTksImV4cCI6MjA5Nzk3MTIxOX0.hsF2SN7OrxIixwDgRznyYYlEtFzw7MKM2WIO7Aqsb0U";
        const clientSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // --- 2. VARIABLES GLOBALES ---
        let CATALOGUE = [];
        let STOCK_DEPOT = [];
        let bordereau = [];

        try {
            bordereau = JSON.parse(localStorage.getItem('nina_depot_bordereau')) || [];
        } catch(e) {
            localStorage.removeItem('nina_depot_bordereau');
            bordereau = [];
        }

        window.addEventListener('load', () => {
            chargerDonneesDepot();
            afficherBordereau();
        });

        function switchTab(tabId) {
            document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            let btnActif = document.querySelector(`button[onclick="switchTab('${tabId}')"]`);
            if (btnActif) btnActif.classList.add('active');
            if (tabId === 'vision') chargerDonneesDepot();
        }

        // --- 3. CHARGEMENT DES DONNÉES DEPUIS SUPABASE ---
        async function chargerTransfertsEnAttente() {
            const conteneur = document.getElementById('liste-transferts-attente');
            if (!conteneur) return;
            const { data, error } = await clientSupabase
                .from('transferts')
                .select('*')
                .eq('statut', 'en_attente')
                .order('created_at', { ascending: false });

            if (error) {
                conteneur.innerHTML = '<span style="color:var(--danger);">Erreur de chargement.</span>';
                return;
            }
            if (!data || data.length === 0) {
                conteneur.innerHTML = '<span style="color:var(--success);">✅ Rien en attente, tout a été réceptionné.</span>';
                return;
            }
            conteneur.innerHTML = data.map(t => `
                <div style="padding:8px 0; border-bottom:1px solid var(--border);">
                    <strong>${t.nom_article}</strong> (${t.couleur_ref}) — ${t.quantite} u.
                    <br><span style="font-size:0.8rem;">➡️ vers ${t.destination === 'RAYON' ? 'Rayon Boutique' : 'Atelier / Machiniste'} · envoyé par ${t.envoye_par || '?'} · en attente de confirmation</span>
                </div>
            `).join('');
        }

        // Écouteur temps réel passif (sans consommer de quota)
        clientSupabase
            .channel('suivi-transferts-depot')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'transferts' }, () => {
                chargerTransfertsEnAttente();
            })
            .subscribe();

        async function chargerDonneesDepot() {
            chargerTransfertsEnAttente();
            try {
                const { data: catData, error: catErr } = await clientSupabase
                    .from('articles_v2')
                    .select('*')
                    .order('nom_article');
                if (catErr) throw catErr;
                CATALOGUE = catData || [];

                const { data: stockData, error: stockErr } = await clientSupabase
                    .from('stock_depot')
                    .select('*');
                if (stockErr) throw stockErr;
                STOCK_DEPOT = stockData || [];

                afficherVisionGlobale();
                remplirSelectArticles();
                construireAlertesCommande();
            } catch (err) {
                alert("ERREUR : " + (err.message || JSON.stringify(err)));
                document.getElementById('table-stock-body').innerHTML = `<td colspan="4" style="text-align: center; padding: 20px; color: #c62828;">❌ Erreur : ${err.message || err}</td>`;
            }            
        }

        // --- 4. AFFICHAGE VISION GLOBALE (TIROIRS) ---
        function afficherVisionGlobale() {
            const conteneur = document.querySelector('.table-responsive'); 
            let html = '';

            if (STOCK_DEPOT.length === 0) {
                conteneur.innerHTML = '<div style="text-align: center; padding: 20px; color: #7f8c8d;">Aucun article en stock</div>';
                return;
            }

            let donneesGroupees = {};
            STOCK_DEPOT.forEach(ligne => {
                let infoArticle = CATALOGUE.find(a => a.id == ligne.article_id) || {};
                let nomArticle = infoArticle.nom_article || 'Article inconnu';
                let famille = infoArticle.famille || 'SANS CATÉGORIE'; 

                if (!donneesGroupees[famille]) donneesGroupees[famille] = {};
                if (!donneesGroupees[famille][nomArticle]) donneesGroupees[famille][nomArticle] = [];
                donneesGroupees[famille][nomArticle].push(ligne);
            });

            for (let famille in donneesGroupees) {
                let idFamille = 'cat_' + Math.random().toString(36).substr(2, 9);
                html += `<div class="titre-famille" onclick="document.getElementById('${idFamille}').classList.toggle('cache')">
                            <span>📦 ${famille.toUpperCase()}</span>
                            <span style="color: var(--gold); font-size: 0.8rem;">▼ OUVRIR</span>
                         </div>
                         <div id="${idFamille}" class="cache" style="padding-left: 15px; border-left: 2px solid var(--border); margin-left: 10px; margin-bottom: 20px;">`;

                for (let article in donneesGroupees[famille]) {
                    let idUnique = 'art_' + Math.random().toString(36).substr(2, 9);
                    html += `<div class="titre-article" onclick="document.getElementById('${idUnique}').classList.toggle('cache')">
                                <span>${article}</span>
                                <span style="color: #888; font-size: 0.8rem;">▼</span>
                             </div>
                             <div id="${idUnique}" class="contenu-couleurs cache">
                                <table style="width: 100%; border-collapse: collapse;">`;
                    
                    donneesGroupees[famille][article].forEach(ligne => {
                        let qte = parseFloat(ligne.quantite);
                        let seuil = parseFloat(ligne.seuil_alerte) || 5;
                        let couleurTexte = (qte <= seuil) ? 'var(--danger)' : 'var(--text-dark)';
                        let nomCouleur = String(ligne.couleur_ref || 'Standard');
                        
                        html += `<tr style="border-bottom: 1px dashed #ccc;" class="ligne-recherche">
                                    <td style="padding: 8px; width: 50%;">🎨 <b>${nomCouleur}</b></td>
                                    <td style="padding: 8px; width: 25%; color: ${couleurTexte}; font-weight: bold;">Qte: ${qte}</td>
                                    <td style="padding: 8px; width: 25%; text-align: right;">
                                        <button onclick="corrigerStock('${ligne.id}', '${nomCouleur.replace(/'/g, "\\'")}', ${qte}, '${ligne.article_id}', '${article.replace(/'/g, "\\'")}')">✏️</button>
                                        <button style="margin-left: 8px;" onclick="supprimerStock('${ligne.id}', '${nomCouleur.replace(/'/g, "\\'")}', ${qte}, '${ligne.article_id}', '${article.replace(/'/g, "\\'")}')">🗑️</button>
                                    </td>
                                 </tr>`;
                    });
                    html += `</table></div>`;
                }
                html += `</div>`;
            }
            conteneur.innerHTML = html; 
        }

        // --- CORRECTION ET SUPPRESSION TRACÉES ---
        async function corrigerStock(idLigne, ancienneCouleur, ancienneQte, articleId, nomArticle) {
            let nouvelleCouleur = prompt(`CORRECTION\nNouveau nom pour la couleur "${ancienneCouleur}" :`, ancienneCouleur);
            if (nouvelleCouleur === null) return; 
            
            let nouvelleQte = prompt(`Nouvelle quantité (actuellement ${ancienneQte}) :`, ancienneQte);
            if (nouvelleQte === null) return; 
            nouvelleQte = parseFloat(nouvelleQte);

            if (isNaN(nouvelleQte) || nouvelleQte < 0) {
                return alert("❌ Quantité invalide !");
            }

            let couleurPropre = nettoyerCouleur(nouvelleCouleur);

            try {
                const { error } = await clientSupabase
                    .from('stock_depot')
                    .update({ couleur_ref: couleurPropre, quantite: nouvelleQte })
                    .eq('id', idLigne);

                if (error) throw error;

                let ecart = nouvelleQte - (parseFloat(ancienneQte) || 0);
                if (ecart !== 0) {
                    await clientSupabase.from('mouvements_stock').insert([{
                        article_id: articleId, nom_article: nomArticle, nom_article_archive: nomArticle,
                        quantite: Math.abs(ecart), quantite_totale: Math.abs(ecart), couleur: couleurPropre,
                        type_mouvement: ecart > 0 ? 'ENTREE' : 'SORTIE',
                        destination: 'Correction manuelle (stock.html)',
                        utilisateur: localStorage.getItem('nomEmploye') || 'Magasinier'
                    }]);
                }
                
                alert("✅ Ligne corrigée avec succès !");
                chargerDonneesDepot(); 
            } catch (err) {
                alert("🚨 Erreur de correction : " + err.message);
            }
        }

        async function supprimerStock(idLigne, couleur, quantiteActuelle, articleId, nomArticle) {
            if (!confirm("Voulez-vous vraiment supprimer cet article de la base de données ?")) return;

            try {
                const { error } = await clientSupabase.from('stock_depot').delete().eq('id', idLigne);
                if (error) throw error;

                if (parseFloat(quantiteActuelle) > 0) {
                    await clientSupabase.from('mouvements_stock').insert([{
                        article_id: articleId, nom_article: nomArticle, nom_article_archive: nomArticle,
                        quantite: quantiteActuelle, quantite_totale: quantiteActuelle, couleur: couleur,
                        type_mouvement: 'SORTIE',
                        destination: 'Suppression manuelle de la ligne (stock.html)',
                        utilisateur: localStorage.getItem('nomEmploye') || 'Magasinier'
                    }]);
                }

                alert('✅ Article supprimé avec succès !');
                chargerDonneesDepot(); 
            } catch (err) {
                alert('🚨 Erreur lors de la suppression : ' + err.message);
            }
        }

                // --- RECHERCHE DANS LE STOCK ---
        function filtrerStock() {
            let recherche = document.getElementById("search-stock").value.toLowerCase();
            let categories = document.querySelectorAll(".titre-famille");

            categories.forEach(titreFamille => {
                let conteneurFamille = titreFamille.nextElementSibling;
                let articles = conteneurFamille.querySelectorAll(".titre-article");
                let familleVisible = false;

                articles.forEach(titreArticle => {
                    let conteneurCouleurs = titreArticle.nextElementSibling;
                    let lignesCouleurs = conteneurCouleurs.querySelectorAll(".ligne-recherche");
                    let nomArticle = titreArticle.innerText.toLowerCase();
                    let articleVisible = false;

                    lignesCouleurs.forEach(ligne => {
                        let texteCouleur = ligne.innerText.toLowerCase();
                        if (nomArticle.includes(recherche) || texteCouleur.includes(recherche)) {
                            ligne.style.display = ""; 
                            articleVisible = true;
                        } else {
                            ligne.style.display = "none"; 
                        }
                    });

                    if (articleVisible) {
                        titreArticle.style.display = ""; 
                        familleVisible = true;
                        if (recherche !== "") conteneurCouleurs.classList.remove("cache"); 
                        else conteneurCouleurs.classList.add("cache"); 
                    } else {
                        titreArticle.style.display = "none"; 
                        conteneurCouleurs.classList.add("cache");
                    }
                });

                if (familleVisible) {
                    titreFamille.style.display = ""; 
                    if (recherche !== "") conteneurFamille.classList.remove("cache"); 
                    else conteneurFamille.classList.add("cache"); 
                } else {
                    titreFamille.style.display = "none"; 
                    conteneurFamille.classList.add("cache");
                }
            });
        }
                
        // --- GESTION DES MOUVEMENTS ET DU BORDEREAU ---
        function remplirSelectArticles() {
            const selectDiv = document.getElementById('custom-list');
            const hiddenSelect = document.getElementById('mvt-article');
            selectDiv.innerHTML = '';
            hiddenSelect.innerHTML = '<option value="">-- Sélectionner un article --</option>';
            
            CATALOGUE.forEach(art => {
                hiddenSelect.innerHTML += `<option value="${art.id}">${art.nom_article}</option>`;
                const nomEchappe = art.nom_article.replace(/'/g, "\\'"); 
                selectDiv.innerHTML += `<div class="custom-option" style="padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 0.9rem;" onclick="choisirArticle('${art.id}', '${nomEchappe}')">${art.nom_article}</div>`;
            });
        }

        function afficherCustomList() {
            document.getElementById('custom-list').style.display = 'block';
        }

        function filtrerCustomList() {
            const recherche = document.getElementById('search-mvt-article').value.toLowerCase();
            document.querySelectorAll('.custom-option').forEach(opt => {
                opt.style.display = opt.innerText.toLowerCase().includes(recherche) ? 'block' : 'none';
            });
        }

        function choisirArticle(id, nom) {
            document.getElementById('search-mvt-article').value = nom;
            document.getElementById('mvt-article').value = id;
            document.getElementById('custom-list').style.display = 'none';
        }

        document.addEventListener('click', function(event) {
            const searchInput = document.getElementById('search-mvt-article');
            const customList = document.getElementById('custom-list');
            if (searchInput && customList && event.target !== searchInput && !customList.contains(event.target)) {
                customList.style.display = 'none';
            }
        });
        
        function toggleDestination() {
            const type = document.getElementById('mvt-type').value;
            document.getElementById('group-destination').style.display = (type === 'SORTIE') ? 'block' : 'none';
        }

        function nettoyerCouleur(texte) {
            if (!texte) return 'STANDARD';
            return texte.toUpperCase().replace(/\s+/g, ' ').trim();
        }
        
        function ajouterAuBordereau() {
            const typeMvt = document.getElementById('mvt-type').value;
            const destination = typeMvt === 'SORTIE' ? document.getElementById('mvt-destination').value : 'Dépôt Principal';
            const selectArt = document.getElementById('mvt-article');
            const idArticle = selectArt.value;
            if (!idArticle) return alert("⚠️ Veuillez sélectionner un article.");
            const nomArticle = selectArt.options[selectArt.selectedIndex].text;

            const couleur = nettoyerCouleur(document.getElementById('mvt-couleur').value);
            const qte = parseFloat(document.getElementById('mvt-qte').value);

            if (isNaN(qte) || qte <= 0) return alert("⚠️ Veuillez saisir une quantité valide !");

            let articleExistant = STOCK_DEPOT.find(s => s.article_id == idArticle && nettoyerCouleur(s.couleur_ref) === couleur);
            let seuilChoisi = 5; 
            
            if (!articleExistant) {
                if (typeMvt === 'SORTIE') {
                    return alert("❌ Impossible ! Vous essayez de faire sortir une couleur (" + couleur + ") qui n'existe pas en stock.");
                } else {
                    let rep = prompt(`✨ Nouvelle couleur détectée : ${couleur} !\nÀ partir de combien d'unités restantes voulez-vous être alerté ?`, "5");
                    if (rep === null) return; 
                    seuilChoisi = parseFloat(rep) || 5;
                }
            } else {
                if (typeMvt === 'SORTIE') {
                    let qteDisponible = parseFloat(articleExistant.quantite) || 0;
                    if (qte > qteDisponible) {
                        return alert(`❌ Stock insuffisant ! Il ne reste que ${qteDisponible} unités pour la couleur "${couleur}".\nVous ne pouvez pas en faire sortir ${qte}.`);
                    }
                }
                seuilChoisi = parseFloat(articleExistant.seuil_alerte) || 5;
            }

            bordereau.push({
                article_id: idArticle,
                nom_article: nomArticle,
                type_mouvement: typeMvt,
                destination: destination,
                couleur: couleur,
                qte: qte,
                seuil: seuilChoisi
            });

            localStorage.setItem('nina_depot_bordereau', JSON.stringify(bordereau));
            document.getElementById('mvt-couleur').value = '';
            document.getElementById('mvt-qte').value = '';
            afficherBordereau();
        }

        function afficherBordereau() {
            const tbody = document.getElementById('table-bordereau');
            tbody.innerHTML = '';
            const btnValider = document.getElementById('btn-valider');

            if (bordereau.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #95a5a6; font-size: 0.9rem;">Le bordereau est vide.</td></tr>';
                btnValider.disabled = true;
                return;
            }

            btnValider.disabled = false;
            bordereau.forEach((item, index) => {
                let icone = item.type_mouvement === 'ENTREE' ? '📥' : '📤';
                let couleurLigne = item.type_mouvement === 'ENTREE' ? 'var(--success)' : 'var(--danger)';
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="color: ${couleurLigne}; font-weight: bold; font-size: 12px;">${icone} ${item.type_mouvement}</td>
                    <td><strong style="font-size: 13px;">${item.nom_article}</strong><br><span style="font-size:11px; color:#7f8c8d;">${item.couleur}</span></td>
                    <td style="font-weight: bold;">${item.qte}</td>
                    <td><button class="btn-block btn-danger" style="margin-top:0;" onclick="supprimerDuBordereau(${index})">❌</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function supprimerDuBordereau(index) {
            bordereau.splice(index, 1);
            localStorage.setItem('nina_depot_bordereau', JSON.stringify(bordereau));
            afficherBordereau();
        }

        async function validerBordereau() {
            if (bordereau.length === 0) return;
            if (!bordereau[0].article_id || bordereau[0].article_id === "") {
                alert("⚠️ Erreur : L'article sélectionné est invalide. Veuillez vider le bordereau et réessayer.");
                return;
            }

            const btn = document.getElementById("btn-valider");
            btn.disabled = true;
            btn.innerText = "⏳ Enregistrement en cours...";
            const nomOperateur = localStorage.getItem('nomEmploye') || 'Magasinier';

            try {
                for (let item of bordereau) {
                    if (item.type_mouvement === 'SORTIE') {
                        const destinationCible = item.destination === 'Rayon Boutique' ? 'RAYON' : 'ATELIER';
                        const { error: erreurTransfert } = await clientSupabase.rpc('creer_transfert', {
                            p_source: 'DEPOT',
                            p_destination: destinationCible,
                            p_article_id: item.article_id,
                            p_couleur: item.couleur,
                            p_quantite: item.qte,
                            p_envoye_par: nomOperateur
                        });
                        if (erreurTransfert) throw erreurTransfert;
                        continue;
                    }

                    const { data: existData, error: selectError } = await clientSupabase
                        .from('stock_depot')
                        .select('*')
                        .eq('article_id', item.article_id);
                    if (selectError) throw selectError;

                    let ligneTrouvee = (existData || []).find(d => nettoyerCouleur(d.couleur_ref) === item.couleur);

                    if (ligneTrouvee) {
                        let nouvelleQte = (parseFloat(ligneTrouvee.quantite) || 0) + item.qte;
                        const { error: updateError } = await clientSupabase
                            .from('stock_depot')
                            .update({ quantite: nouvelleQte })
                            .eq('id', ligneTrouvee.id);
                        if (updateError) throw updateError;
                    } else {
                        const { error: insertError } = await clientSupabase
                            .from('stock_depot')
                            .insert([{
                                article_id: item.article_id,
                                couleur_ref: item.couleur,
                                quantite: item.qte,
                                seuil_alerte: item.seuil
                            }]);
                        if (insertError) throw insertError;
                    }

                    const { error: erreurHistorique } = await clientSupabase
                        .from('mouvements_stock')
                        .insert([{
                            article_id: item.article_id,
                            nom_article: item.nom_article,
                            nom_article_archive: item.nom_article,
                            quantite: item.qte,
                            quantite_totale: item.qte,
                            couleur: item.couleur,
                            type_mouvement: item.type_mouvement,
                            destination: item.destination,
                            utilisateur: nomOperateur
                        }]);
                    if (erreurHistorique) throw erreurHistorique;
                }

                alert("✅ Le bordereau a été enregistré avec succès !");
                bordereau = [];
                localStorage.removeItem("nina_depot_bordereau");
                afficherBordereau();
                chargerDonneesDepot(); 
                btn.innerText = "💾 ENREGISTRER DANS LA BASE";
            } catch (err) {
                console.error(err);
                alert("❌ Erreur lors de l'enregistrement.\nDétail : " + (err.message || "Problème réseau"));
                btn.disabled = false;
                btn.innerText = "🔄 RÉESSAYER";
            }
        }
            
        // --- ALERTES ET GÉNÉRATEUR WHATSAPP ---
        function construireAlertesCommande() {
            const conteneur = document.getElementById('liste-alertes');
            const btnWhatsApp = document.getElementById('btn-whatsapp');
            conteneur.innerHTML = '';

            let enAlerte = STOCK_DEPOT.filter(art => parseFloat(art.quantite) <= parseFloat(art.seuil_alerte));

            if (enAlerte.length === 0) {
                conteneur.innerHTML = '<div style="color: var(--success); text-align: center; font-weight: bold; padding: 20px;">✅ Tout va bien, aucun article n\'est en rupture.</div>';
                btnWhatsApp.style.display = 'none';
                return;
            }

            btnWhatsApp.style.display = 'flex';
            enAlerte.forEach(ligne => {
                let infoArticle = CATALOGUE.find(a => a.id == ligne.article_id) || {};
                let nom = infoArticle.nom_article || 'Article inconnu';
                conteneur.innerHTML += `
                    <div class="alerte-card">
                        <div>
                            <strong style="color: var(--primary);">${nom}</strong><br>
                            <span style="font-size: 13px; color: #7f8c8d;">Couleur: ${ligne.couleur_ref}</span>
                        </div>
                        <div style="text-align: right;">
                            <strong style="color: var(--danger); font-size: 1.1rem;">Reste : ${ligne.quantite}</strong><br>
                            <span style="font-size: 11px; color: var(--gold); font-weight: bold;">(Seuil: ${ligne.seuil_alerte})</span>
                        </div>
                    </div>
                `;
            });
        }

        function envoyerWhatsApp() {
            let enAlerte = STOCK_DEPOT.filter(art => parseFloat(art.quantite) <= parseFloat(art.seuil_alerte));
            if (enAlerte.length === 0) return;

            let texte = "🚨 *ALERTE RUPTURE - DÉPÔT NINA FASHION* 🚨\n\nBonjour, voici les articles à recommander urgemment :\n\n";
            enAlerte.forEach(ligne => {
                let infoArticle = CATALOGUE.find(a => a.id == ligne.article_id) || {};
                let nom = infoArticle.nom_article || 'Article inconnu';
                texte += `🔸 *${nom}* (${ligne.couleur_ref})\n👉 Reste : ${ligne.quantite} (Seuil paramétré : ${ligne.seuil_alerte})\n\n`;
            });
            texte += "_Message envoyé depuis l'application logistique du dépôt._";
            window.open("https://wa.me/?text=" + encodeURIComponent(texte), '_blank');
        }
    </script>
